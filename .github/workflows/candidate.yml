name: Upstream candidate

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: artifact-changes
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.filter.outputs.artifact }}
      renovate_config: ${{ steps.filter.outputs.renovate_config }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test CI scope classifier
        run: node scripts/test-ci-scope.mjs
      - name: Detect artifact-sensitive changes
        id: filter
        run: node scripts/ci-scope.mjs

  renovate_config:
    name: renovate-config
    needs: changes
    if: needs.changes.outputs.renovate_config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate Renovate configuration
        run: |
          renovate_version=$(sed -n 's/^[[:space:]]*RENOVATE_VERSION: "\([^"]*\)"$/\1/p' .github/workflows/renovate.yml)
          test -n "$renovate_version"
          pnpm dlx --package "renovate@$renovate_version" renovate-config-validator renovate.json

  native-wasm:
    name: native-wasm
    needs: changes
    if: needs.changes.outputs.artifact == 'true'
    runs-on: ubuntu-latest
    # renovate: datasource=docker depName=emscripten/emsdk
    container: emscripten/emsdk:6.0.6
    steps:
      - uses: actions/checkout@v7
      - name: Build kaldifst + OpenFST WASM
        run: platform/kaldifst-wasm/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kaldifst-wasm
          path: platform/kaldifst-wasm/dist/

  browser-gates:
    name: browser-gates
    needs: native-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - uses: actions/download-artifact@v8
        with:
          name: kaldifst-wasm
          path: platform/kaldifst-wasm/dist/
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium-headless-shell
      - name: Fetch immutable Matcha assets
        run: pnpm fetch:matcha-assets
        env:
          WASM_TTS_ASSET_REPORT: release-artifacts/assets.json
      - name: Run complete candidate gate
        run: pnpm test:release-gates
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-report
          path: |
            release-artifacts/
            platform/results/results-matcha_icefall_zh_en-browser-wasm.json
            platform/results/results-matcha_icefall_zh_en-stream-browser-wasm.json
            platform/results/asr-listening-report.json

  candidate-gate:
    name: candidate-gate
    if: always()
    needs: [changes, renovate_config, native-wasm, browser-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Require every candidate combination
        env:
          ARTIFACT_CHANGED: ${{ needs.changes.outputs.artifact }}
          RENOVATE_CONFIG_CHANGED: ${{ needs.changes.outputs.renovate_config }}
          RENOVATE_CONFIG_RESULT: ${{ needs.renovate_config.result }}
          NATIVE_RESULT: ${{ needs.native-wasm.result }}
          BROWSER_RESULT: ${{ needs.browser-gates.result }}
        run: |
          printf 'artifact=%s\nrenovate-config=%s\nrenovate-config-job=%s\nnative-wasm=%s\nbrowser-gates=%s\n' "$ARTIFACT_CHANGED" "$RENOVATE_CONFIG_CHANGED" "$RENOVATE_CONFIG_RESULT" "$NATIVE_RESULT" "$BROWSER_RESULT"
          case "$RENOVATE_CONFIG_CHANGED" in
            true)
              test "$RENOVATE_CONFIG_RESULT" = success
              ;;
            false)
              test "$RENOVATE_CONFIG_RESULT" = skipped
              ;;
            *)
              echo "Renovate config detector did not produce a valid result" >&2
              exit 1
              ;;
          esac

          case "$ARTIFACT_CHANGED" in
            true)
              test "$NATIVE_RESULT" = success
              test "$BROWSER_RESULT" = success
              ;;
            false)
              test "$NATIVE_RESULT" = skipped
              test "$BROWSER_RESULT" = skipped
              ;;
            *)
              echo "artifact detector did not produce a valid result" >&2
              exit 1
              ;;
          esac
