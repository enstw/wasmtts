name: Tested release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional SemVer tag (for example v1.0.0)
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: tested-release
  cancel-in-progress: false

jobs:
  changes:
    name: artifact-changes
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.filter.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Detect artifact-sensitive changes
        id: filter
        run: node scripts/ci-scope.mjs

  native-wasm:
    name: release-native-wasm
    needs: changes
    if: needs.changes.outputs.artifact == 'true'
    runs-on: ubuntu-latest
    # renovate: datasource=docker depName=emscripten/emsdk
    container: emscripten/emsdk:6.0.6
    steps:
      - uses: actions/checkout@v7
      - name: Build kaldifst + OpenFST WASM
        run: platform/kaldifst-wasm/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-kaldifst-wasm
          path: platform/kaldifst-wasm/dist/

  test-and-release:
    name: test-and-release
    if: always() && needs.changes.outputs.artifact == 'true'
    needs: [changes, native-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - if: needs.native-wasm.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: release-kaldifst-wasm
          path: platform/kaldifst-wasm/dist/
      - name: Install JavaScript dependencies
        id: dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Install Chromium headless shell
        id: browser
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: pnpm exec playwright-core install --with-deps chromium-headless-shell
      - name: Fetch immutable Matcha assets
        id: assets
        if: steps.browser.outcome == 'success' && needs.native-wasm.result == 'success'
        continue-on-error: true
        run: pnpm fetch:matcha-assets
        env:
          WASM_TTS_ASSET_REPORT: release-artifacts/assets.json
      - name: Run complete release gate
        id: gates
        if: steps.assets.outcome == 'success'
        continue-on-error: true
        run: pnpm test:release-gates
      - name: Record infrastructure failure
        if: steps.gates.outcome == 'skipped'
        env:
          NATIVE_RESULT: ${{ needs.native-wasm.result }}
          DEPENDENCY_RESULT: ${{ steps.dependencies.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          ASSET_RESULT: ${{ steps.assets.outcome }}
        run: |
          mkdir -p release-artifacts
          printf '{"schemaVersion":1,"commit":"%s","status":"failed","combinations":[{"name":"native-wasm","status":"%s"},{"name":"dependencies","status":"%s"},{"name":"browser","status":"%s"},{"name":"assets","status":"%s"}]}\n' "$GITHUB_SHA" "$NATIVE_RESULT" "$DEPENDENCY_RESULT" "$BROWSER_RESULT" "$ASSET_RESULT" > release-artifacts/release-gates.json
      - name: Package tested frontend
        id: package
        if: steps.gates.outcome == 'success'
        continue-on-error: true
        # 打包內容由 scripts/release-manifest.json 定義，與 package-smoke gate
        # 共用同一條組包路徑 — 出貨的 tarball 就是 gate 測過的那套邏輯產出的。
        run: node scripts/package-release.mjs
      - name: Attest tested frontend
        id: attest
        if: steps.package.outcome == 'success'
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-path: release-artifacts/wasmtts-frontend.tar.gz
      - name: Record packaging or attestation failure
        if: steps.gates.outcome == 'success' && (steps.package.outcome != 'success' || steps.attest.outcome != 'success')
        env:
          PACKAGE_RESULT: ${{ steps.package.outcome }}
          ATTEST_RESULT: ${{ steps.attest.outcome }}
        run: |
          jq --arg package "$PACKAGE_RESULT" --arg attest "$ATTEST_RESULT" '.status="failed" | .combinations += [{name:"package",status:$package},{name:"attestation",status:$attest}]' release-artifacts/release-gates.json > release-artifacts/release-gates.tmp
          mv release-artifacts/release-gates.tmp release-artifacts/release-gates.json
      - name: Resolve release identity
        id: release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_SUCCEEDED: ${{ steps.gates.outcome == 'success' && steps.package.outcome == 'success' && steps.attest.outcome == 'success' }}
        run: |
          if [[ "$RELEASE_SUCCEEDED" != true ]]; then
            tag="candidate-failed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            tag="$REQUESTED_TAG"
            if [[ -z "$tag" && "$HEAD_COMMIT_MESSAGE" =~ Release-Version:[[:space:]]*(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
              tag="${BASH_REMATCH[1]}"
            fi
            if [[ -n "$tag" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $tag" >&2
              exit 1
            elif [[ -z "$tag" ]]; then
              releases_json="$(gh release list --limit 1000 --json tagName,isDraft,isPrerelease)"
              tag="$(WASM_TTS_RELEASES_JSON="$releases_json" node scripts/next-release-tag.mjs)"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Generate RELEASE.md
        if: always() && steps.release.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/generate-release-md.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tested-release-report
          path: release-artifacts/
      - name: Publish successful release
        if: steps.release.outcome == 'success' && steps.gates.outcome == 'success' && steps.package.outcome == 'success' && steps.attest.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-artifacts/wasmtts-frontend.tar.gz \
            release-artifacts/package/matcha-taiwan-profile.js \
            release-artifacts/RELEASE.md \
            release-artifacts/release-gates.json \
            release-artifacts/assets.json \
            platform/results/results-matcha_icefall_zh_en-browser-wasm.json \
            platform/results/results-matcha_icefall_zh_en-stream-browser-wasm.json \
            platform/results/asr-listening-report.json \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG — Matcha browser frontend" \
            --notes-file release-artifacts/RELEASE.md \
            --latest
      - name: Publish failed candidate record
        if: steps.release.outcome == 'success' && (steps.gates.outcome != 'success' || steps.package.outcome != 'success' || steps.attest.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-artifacts/release-gates.json \
            release-artifacts/RELEASE.md \
            --target "$GITHUB_SHA" \
            --title "Failed candidate — ${GITHUB_SHA::12}" \
            --notes-file release-artifacts/RELEASE.md \
            --prerelease
