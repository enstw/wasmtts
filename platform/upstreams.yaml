# Renovate 更新此 manifest 的上游版本；candidate workflow 會自動下載該
# revision，記錄 SHA-256，並執行 FST、waveform、RTF、memory 與 ASR gates。

upstreams:
  # CI 聽回模型固定 revision，避免 ASR oracle 自行漂移。
  # renovate: datasource=git-refs depName=asr-faster-whisper-small packageName=https://huggingface.co/Systran/faster-whisper-small.git versioning=loose
  - version: 2ec96c5472da50d38d40c0cfe0602af2e94b4c8a
    assets:
      - Systran/faster-whisper-small

  # Matcha acoustic model、lexicon、tokens 與三個中文 FST 必須同 commit 更新。
  # renovate: datasource=git-refs depName=matcha-frontend packageName=https://huggingface.co/csukuangfj/matcha-icefall-zh-en.git versioning=loose
  - version: fbe59d77057428c32111d5f3ea4ed67a7d440c61
    assets:
      - matcha-icefall-zh-en/model-steps-3.onnx
      - matcha-icefall-zh-en/lexicon.txt
      - matcha-icefall-zh-en/tokens.txt
      - matcha-icefall-zh-en/phone-zh.fst
      - matcha-icefall-zh-en/date-zh.fst
      - matcha-icefall-zh-en/number-zh.fst
      - platform/matcha-assets.json

  # 完整 512 MiB frontend bundle 只保留為上游 control，仍需收到更新通知。
  # renovate: datasource=github-releases depName=sherpa-onnx-browser-control packageName=k2-fsa/sherpa-onnx
  - version: v1.13.4
    assets:
      - sherpa-onnx-wasm-simd-matcha-icefall-zh-en

  # kaldifst 由 CMakeLists.txt 直接更新；此項追蹤它使用的 OpenFST fork。
  # renovate: datasource=github-tags depName=kaldifst-openfst packageName=csukuangfj/openfst
  - version: v1.8.5-2026-04-10
    assets:
      - OpenFST static library linked into matcha-kaldifst-normalizer.wasm

  # 本機建置工具版本；升級後由 native build 與 browser golden 自動驗證。
  # renovate: datasource=github-releases depName=emscripten packageName=emscripten-core/emscripten
  - version: 6.0.6
    assets:
      - platform/kaldifst-wasm/dist/matcha-kaldifst-normalizer.js
      - platform/kaldifst-wasm/dist/matcha-kaldifst-normalizer.wasm
