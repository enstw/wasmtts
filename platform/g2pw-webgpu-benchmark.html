<title>g2pW WebGPU benchmark</title>

<script type="module">
import * as ORT from 'onnxruntime-web/webgpu';

const tensor = ({type, dims, data}) => new ORT.Tensor(
  type,
  type === 'int64' ? BigInt64Array.from(data, BigInt) : Float32Array.from(data),
  dims,
);

let persistentSession = null;

async function initialize(modelPath) {
  if (!navigator.gpu) throw new Error('navigator.gpu is unavailable');
  if (!persistentSession) persistentSession = await ORT.InferenceSession.create(modelPath, {
    executionProviders: ['webgpu'],
    graphOptimizationLevel: 'all',
  });
  return {runtime: ORT.env.versions?.web};
}

async function inferFeeds(feedValues) {
  if (!persistentSession) throw new Error('g2pW WebGPU session is not initialized');
  const feeds = Object.fromEntries(Object.entries(feedValues).map(([name, value]) => [name, tensor(value)]));
  const started = performance.now();
  const outputs = await persistentSession.run(feeds);
  const first = outputs[persistentSession.outputNames[0]];
  const values = await first.getData();
  const classes = first.dims.at(-1);
  const argmax = [];
  const maxProbability = [];
  for (let row = 0; row < first.dims[0]; row += 1) {
    let best = 0;
    for (let column = 1; column < classes; column += 1) {
      if (values[row * classes + column] > values[row * classes + best]) best = column;
    }
    argmax.push(best);
    maxProbability.push(values[row * classes + best]);
  }
  Object.values(outputs).forEach((output) => output.dispose());
  Object.values(feeds).forEach((input) => input.dispose());
  return {wallMs: performance.now() - started, argmax, maxProbability};
}

window.g2pwWebgpuBench = {
  initialize,
  inferFeeds,
  async run({fixtureUrl, iterations = 5}) {
    if (!navigator.gpu) throw new Error('navigator.gpu is unavailable');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('WebGPU adapter is unavailable');
    const fixture = await (await fetch(fixtureUrl)).json();
    const initializedAt = performance.now();
    await initialize(fixture.model.path);
    const initializationMs = performance.now() - initializedAt;

    const infer = async () => {
      return inferFeeds(fixture.feeds);
    };

    await infer();
    const runs = [];
    for (let index = 0; index < iterations; index += 1) runs.push(await infer());
    const mismatches = runs[0].argmax
      .map((value, index) => value === fixture.expectedArgmax[index] ? null : ({index, expected: fixture.expectedArgmax[index], actual: value}))
      .filter(Boolean);
    return {
      runtime: {ort: ORT.env.versions?.web, userAgent: navigator.userAgent},
      adapter: {features: [...adapter.features].sort(), limits: Object.fromEntries(Object.entries(adapter.limits))},
      model: fixture.model,
      queries: fixture.queries,
      batchSize: fixture.batchSize,
      initializationMs,
      warmups: 1,
      runs: runs.map(({wallMs}) => ({wallMs, queriesPerSecond: fixture.batchSize * 1000 / wallMs})),
      predictionMismatches: mismatches,
      predictions: runs[0].argmax.map((labelId, index) => ({
        labelId,
        phone: fixture.labels[labelId],
        confidence: runs[0].maxProbability[index],
      })),
      maxProbabilityDelta: Math.max(...runs[0].maxProbability.map((value, index) => Math.abs(value - fixture.expectedMaxProbability[index]))),
    };
  },
};
window.ready = true;
</script>
